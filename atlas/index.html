<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Atlas — command console for your daily tools.">
<title>Atlas — Ask Atlas</title>
<script src="../js/atlas-settings.js"></script>
<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="./atlas.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="atlas-shell">

  <header class="atlas-topbar">
    <a class="atlas-back" href="../dashboard/" title="Back to Dashboard" aria-label="Back to Dashboard">←</a>
    <a class="atlas-brand" href="../dashboard/"><span class="atlas-brand-icon">◈</span>Atlas</a>
    <nav class="atlas-topnav">
      <a href="../dashboard/">Dashboard</a>
      <a href="../tools/budget-tracker/">Budget</a>
      <a class="active" href="./">Ask Atlas</a>
    </nav>
    <button class="atlas-clear" id="clearBtn" type="button" title="Clear console">Clear</button>
  </header>

  <main class="atlas-console" id="consoleLog" aria-live="polite">
    <div class="log-row log-atlas">
      <div class="log-bubble">
        <p>Hi — I'm Atlas. Try <code>/expense 200 food lunch</code> or just say <em>"spent 200 on food"</em>. Type <code>/help</code> to see everything.</p>
      </div>
    </div>
  </main>

  <div class="atlas-inputbar">
    <div class="atlas-chips" id="suggestions"></div>
    <form class="atlas-composer" id="composer">
      <input id="commandInput" type="text" autocomplete="off" inputmode="text" autofocus placeholder="Ask Atlas or type a command…" aria-label="Ask Atlas">
      <button type="submit" id="commandButton" aria-label="Send">➔</button>
    </form>
  </div>

  <nav class="atlas-mobile-bar">
    <a href="../dashboard/"><span>🏠</span>Home</a>
    <a href="../tools/budget-tracker/"><span>💰</span>Budget</a>
    <a class="active" href="./"><span>🤖</span>Atlas</a>
  </nav>
</div>

<script src="./atlas.js"></script>
</body>
</html>
